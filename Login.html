<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container form-box">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login Account</h1>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button type="submit">Login Account</button>
        </form>
        <p id="message" class="message" aria-live="polite"></p>
        <p class="small-text">Don't have an account? <a href="register.html">Register here</a>.</p>
        <a href="mainpage.html">Back to Mainpage</a>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const postData = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("http://127.0.0.1:8000/usersLogin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(postData)
                });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Login failed.");
                }

                message.textContent = "Login successful! Opening the survey...";
                message.className = "message success";
                window.location.href = "index.html";
            } catch (error) {
                message.textContent = error.message + " Make sure the backend is running.";
                message.className = "message error";
            }
        });
    </script>
</body>
</html>
