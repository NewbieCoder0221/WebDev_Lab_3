<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		Username
		<input id='user' type='text'>
		Gender
		<select id='gender'>
			<option value="" disabled selected>Select Gender</option>
			<option value="Male">Male</option>
			<option value="Female">Female</option>
		</select>
		Weapon Type
		<select id='weapon'>
			<option value="" disabled selected>Select Weapon Type</option>
			<option value="greatsword">Great Sword</option>
			<option value="longsword">Long Sword</option>
			<option value="dualblades">Dual Blades</option>
			<option value="lance">Lance</option>
			<option value="hammer">Hammer</option>
			<option value="chargeblade">Charge Blade</option>
			<option value="heavybowgun">Heavy Bowgun</option>
			<option value="bow">Bow</option>
			<option value="greatsword">Great Sword</option>
			<option value="longsword">Long Sword</option>
			<option value="greatsword">Great Sword</option>
			<option value="longsword">Long Sword</option>
		</select>
		Armor Set
		<select id='armor'>
			<option value="" disabled selected>Select Armor Set</option>
			<option value="Jagras">Jagras</option>
			<option value="Chainmail">Chainmail</option>
			<option value="Leather">Leather</option>
			<option value="Pukie">Pukie</option>
			<option value="Kulu">Kulu</option>
			<option value="Guild">Guild</option>
			<option value="Jyura">Jyura</option>
			<option value="Girros">Girros</option>
			<option value="Vespoid">Vespoid</option>
			<option value="Hunter">Hunter</option>
			<option value="Bone">Bone</option>
			<option value="Barroth">Barroth</option>
			<option value="Alloy">Alloy</option>
			<option value="Rathian">Rathian</option>
			<option value="Anja">Anja</option>
			<option value="Butterfly">Butterfly</option>
			<option value="King beetle">King Beetle</option>
			<option value="High Metal">High Metal</option>
			<option value="Hornetaur">Hornetaur</option>
			<option value="Kadachi">Kadachi</option>
			<option value="Chainmail">Chainmail</option>
			<option value="Rathalos">Rathalos</option>
		</select>
		Elemental Type
		<select id='element'>
			<option value="" disabled selected>Select Element Type</option>
			<option value="fire">Fire</option>
			<option value="water">Water</option>
			<option value="ice">Ice</option>
			<option value="thunder">Thunder</option>
			<option value="dragon">Dragon</option>
			<option value="paralysis">Paralysis</option>
			<option value="poison">Poison</option>
			<option value="blast">Blast</option>
			<option value="sleep">Sleep</option>
			<option value="longsword">Long Sword</option>
			<option value="greatsword">Great Sword</option>
			<option value="longsword">Long Sword</option>
		</select>
		Level
		<input id='level' type='number' min="1" max="90" step="1">
		Least Favorite Monster to Hunt
		<select id='least_favorite_monster'>
			<option value="" disabled selected>Select Monster</option>
			<option value="Greate Girros">Greate Girros</option>
			<option value="Kulu-Ya-Ku">Kulu-Ya-Ku</option>
			<option value="Pukei-Pukei">Pukei-Pukei</option>
			<option value="Great Girros">Great Girros</option>
			<option value="Jyuratodos">Jyuratodos</option>
			<option value="Barroth">Barroth</option>
			<option value="Anjanath">Anjanath</option>
			<option value="Tobi-Kadachi">Tobi-Kadachi</option>
			<option value="Rathian">Rathian</option>
			<option value="Rathalos">Rathalos</option>
			<option value="Diablos">Diablos</option>
			<option value="Radobaan">Radobaan</option>
			<option value="Odoragon">Odoragon</option>
			<option value="Tzitzi-ya-ku">Tzitzi-ya-ku</option>
			<option value="Paolumu">Paolumu</option>
			<option value="Legiana">Legiana</option>
			<option value="Ruger Aidal">Ruger Aidal</option>
		</select>
		Most Favorite Monster to Hunt
		<select id='most_favorite_monster'>
				<option value="" disabled selected>Select Monster</option>
			<option value="Greate Girros">Greate Girros</option>
			<option value="Kulu-Ya-Ku">Kulu-Ya-Ku</option>
			<option value="Pukei-Pukei">Pukei-Pukei</option>
			<option value="Great Girros">Great Girros</option>
			<option value="Jyuratodos">Jyuratodos</option>
			<option value="Barroth">Barroth</option>
			<option value="Anjanath">Anjanath</option>
			<option value="Tobi-Kadachi">Tobi-Kadachi</option>
			<option value="Rathian">Rathian</option>
			<option value="Rathalos">Rathalos</option>
			<option value="Diablos">Diablos</option>
			<option value="Radobaan">Radobaan</option>
			<option value="Odoragon">Odoragon</option>
			<option value="Tzitzi-ya-ku">Tzitzi-ya-ku</option>
			<option value="Paolumu">Paolumu</option>
			<option value="Legiana">Legiana</option>
			<option value="Ruger Aidal">Ruger Aidal</option>
		</select>
		Successful Hunts Done
		<input id='hunts_done' type='number' min="0" max="200" step="1">
		Did you Kill Ruger Aidal?
		<select id='Ruger_Aidal_Kill_Confirm'>
			<option value="" disabled selected>Select Answer</option>
			<option value='YES'>YES</option>
			<option value='NO'>NO</option>
		</select>

		<button type="button" onclick="clickButton( document.getElementById('user').value ,document.getElementById('gender').value, 
		document.getElementById('weapon').value ,document.getElementById('armor').value,
		document.getElementById('element').value ,Number(document.getElementById('level').value),
		document.getElementById('least_favorite_monster').value ,document.getElementById('most_favorite_monster').value,
		Number(document.getElementById('hunts_done').value) ,document.getElementById('Ruger_Aidal_Kill_Confirm').value)">Let's Hunt!</button>

		<script>
		

		const clickButton = (a,b,c,d,e,f,g,h,i,j) =>{

			const postData = {
				user:a,
				gender:b,
				weapon:c,
				armor:d,
				element:e,
				level:f,
				least_favorite_monster:g,
				most_favorite_monster:h,
				hunts_done:i,
				Ruger_Aidal_Kill_Confirm:j
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/usersLogin',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
