<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Hunter Survey</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container survey-container">
        <p class="eyebrow">HUNTER PROFILE</p>
        <h1>Monster Hunter Survey</h1>
        <p>Fill in your profile and submit your answers.</p>

        <form id="surveyForm">
            <label for="user">Username</label>
            <input id="user" type="text" required>

            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="weapon">Weapon Type</label>
            <select id="weapon" required>
                <option value="" disabled selected>Select Weapon Type</option>
                <option value="greatsword">Great Sword</option>
                <option value="longsword">Long Sword</option>
                <option value="dualblades">Dual Blades</option>
                <option value="lance">Lance</option>
                <option value="hammer">Hammer</option>
                <option value="chargeblade">Charge Blade</option>
                <option value="heavybowgun">Heavy Bowgun</option>
                <option value="bow">Bow</option>
            </select>

            <label for="armor">Armor Set</label>
            <select id="armor" required>
                <option value="" disabled selected>Select Armor Set</option>
                <option value="Jagras">Jagras</option>
                <option value="Chainmail">Chainmail</option>
                <option value="Leather">Leather</option>
                <option value="Pukie">Pukie</option>
                <option value="Kulu">Kulu</option>
                <option value="Guild">Guild</option>
                <option value="Jyura">Jyura</option>
                <option value="Girros">Girros</option>
                <option value="Vespoid">Vespoid</option>
                <option value="Hunter">Hunter</option>
                <option value="Bone">Bone</option>
                <option value="Barroth">Barroth</option>
                <option value="Alloy">Alloy</option>
                <option value="Rathian">Rathian</option>
                <option value="Anja">Anja</option>
                <option value="Butterfly">Butterfly</option>
                <option value="King beetle">King Beetle</option>
                <option value="High Metal">High Metal</option>
                <option value="Hornetaur">Hornetaur</option>
                <option value="Kadachi">Kadachi</option>
                <option value="Rathalos">Rathalos</option>
            </select>

            <label for="element">Elemental Type</label>
            <select id="element" required>
                <option value="" disabled selected>Select Element Type</option>
                <option value="fire">Fire</option>
                <option value="water">Water</option>
                <option value="ice">Ice</option>
                <option value="thunder">Thunder</option>
                <option value="dragon">Dragon</option>
                <option value="paralysis">Paralysis</option>
                <option value="poison">Poison</option>
                <option value="blast">Blast</option>
                <option value="sleep">Sleep</option>
            </select>

            <label for="level">Level</label>
            <input id="level" type="number" min="1" max="90" step="1" required>

            <label for="least_favorite_monster">Least Favorite Monster to Hunt</label>
            <select id="least_favorite_monster" required>
                <option value="" disabled selected>Select Monster</option>
                <option>Great Girros</option><option>Kulu-Ya-Ku</option><option>Pukei-Pukei</option>
                <option>Jyuratodos</option><option>Barroth</option><option>Anjanath</option>
                <option>Tobi-Kadachi</option><option>Rathian</option><option>Rathalos</option>
                <option>Diablos</option><option>Radobaan</option><option>Odoragon</option>
                <option>Tzitzi-ya-ku</option><option>Paolumu</option><option>Legiana</option>
                <option>Ruger Aidal</option>
            </select>

            <label for="most_favorite_monster">Most Favorite Monster to Hunt</label>
            <select id="most_favorite_monster" required>
                <option value="" disabled selected>Select Monster</option>
                <option>Great Girros</option><option>Kulu-Ya-Ku</option><option>Pukei-Pukei</option>
                <option>Jyuratodos</option><option>Barroth</option><option>Anjanath</option>
                <option>Tobi-Kadachi</option><option>Rathian</option><option>Rathalos</option>
                <option>Diablos</option><option>Radobaan</option><option>Odoragon</option>
                <option>Tzitzi-ya-ku</option><option>Paolumu</option><option>Legiana</option>
                <option>Ruger Aidal</option>
            </select>

            <label for="hunts_done">Successful Hunts Done</label>
            <input id="hunts_done" type="number" min="0" max="200" step="1" required>

            <label for="Ruger_Aidal_Kill_Confirm">Did you Kill Ruger Aidal?</label>
            <select id="Ruger_Aidal_Kill_Confirm" required>
                <option value="" disabled selected>Select Answer</option>
                <option value="YES">YES</option>
                <option value="NO">NO</option>
            </select>

            <button type="submit">Let's Hunt!</button>
        </form>

        <p id="message" class="message" aria-live="polite"></p>
        <a href="mainpage.html">Back to Mainpage</a>
    </main>

    <script>
        const surveyForm = document.getElementById("surveyForm");
        const message = document.getElementById("message");

        surveyForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const postData = {
                user: document.getElementById("user").value,
                gender: document.getElementById("gender").value,
                weapon: document.getElementById("weapon").value,
                armor: document.getElementById("armor").value,
                element: document.getElementById("element").value,
                level: Number(document.getElementById("level").value),
                least_favorite_monster: document.getElementById("least_favorite_monster").value,
                most_favorite_monster: document.getElementById("most_favorite_monster").value,
                hunts_done: Number(document.getElementById("hunts_done").value),
                Ruger_Aidal_Kill_Confirm: document.getElementById("Ruger_Aidal_Kill_Confirm").value
            };

            try {
                const response = await fetch("http://127.0.0.1:8000/users", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(postData)
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.detail || "Could not submit the survey.");
                }
                message.textContent = "Survey submitted successfully! Response number: " + result.id;
                message.className = "message success";
                surveyForm.reset();
            } catch (error) {
                message.textContent = error.message + " Make sure the backend is running.";
                message.className = "message error";
            }
        });
    </script>
</body>
</html>
